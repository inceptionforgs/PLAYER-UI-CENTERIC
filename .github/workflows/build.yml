name: Build Mewati Tune APK

on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.1'
          channel: 'stable'

      - run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build APK (debug-signed CI)
        run: >
          flutter build apk --release
          --dart-define=AUDIO_CDN_HOST=vryngmkjnposksoaknik.supabase.co
          --dart-define=SUPABASE_URL=https://vryngmkjnposksoaknik.supabase.co
          --dart-define=SUPABASE_ANON_KEY=sb_publishable_Okwcoet2gdq9H0CY8y6oUA_g3-w-AKX
        env:
          ORG_GRADLE_PROJECT_ciDebugSign: "true"

      - uses: actions/upload-artifact@v4
        with:
          name: app-release-debug-signed
          path: build/app/outputs/flutter-apk/app-release.apk
